<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoavaliação — Questionário</title>
    <link rel="stylesheet" href="../static/css/formavaliacao.css">
    <link rel="stylesheet" href="../static/css/autoavaliacaoStyle.css">
</head>
<body>

<main class="container">
    <form id="formAvaliacao" class="form-card">

        <div class="form-header">
            <h1>Questionário de Avaliação</h1>
            <p>Preencha as informações clínicas do paciente.</p>
        </div>

        <section class="question">
            <label>Já fez exame de DNA para detectar a Síndrome do X Frágil? *</label>
            <div class="radio-group">
                <label><input type="radio" name="fezExameDNA" value="NAO" required> Não</label>
                <label><input type="radio" name="fezExameDNA" value="SIM"> Sim</label>
            </div>
        </section>

        <section class="question">
            <label>Tem interesse em fazer o exame de DNA para X Frágil?</label>
            <div class="radio-group">
                <label><input type="radio" name="interesseExameDNA" value="NAO"> Não</label>
                <label><input type="radio" name="interesseExameDNA" value="SIM"> Sim</label>
            </div>
        </section>

        <section class="question">
            <label>Se SIM, qual o resultado?</label>
            <select name="resultadoDNA">
                <option value="">Selecione</option>
                <option value="MUTACAO_COMPLETA">Mutação Completa (+200 repetições)</option>
                <option value="PRE_MUTACAO">Pré-mutação (55 a 199 repetições)</option>
                <option value="ZONA_GRAY">Zona Gray/Intermediária (45 a 54 repetições)</option>
                <option value="MOSAICISMO">Mosaicismo</option>
                <option value="NEGATIVO_XF">Negativo para XF (até 39 repetições)</option>
                <option value="NAO_SEI">Não Sei</option>
            </select>
        </section>

        <section class="question">
            <label>Possui diagnóstico de AUTISMO? *</label>
            <div class="radio-group">
                <label><input type="radio" name="autismo" value="NAO" required> Não</label>
                <label><input type="radio" name="autismo" value="SIM"> Sim</label>
            </div>
        </section>

        <section class="question">
            <label>Tem irmãos? *</label>
            <div class="radio-group">
                <label><input type="radio" name="irmaos" value="NAO" required> Não</label>
                <label><input type="radio" name="irmaos" value="SIM"> Sim</label>
            </div>
        </section>

        <section class="question">
            <label>Há alguém na família com deficiência intelectual, atraso de desenvolvimento, dificuldades de aprendizagem ou autismo? *</label>
            <div class="radio-group">
                <label><input type="radio" name="historicoFamiliarNeuro" value="NAO" required> Não</label>
                <label><input type="radio" name="historicoFamiliarNeuro" value="SIM"> Sim</label>
                <label><input type="radio" name="historicoFamiliarNeuro" value="NAO_SEI"> Não Sei</label>
            </div>
        </section>

        <section class="question">
            <label>Há antecedentes na família com diagnóstico de menopausa precoce? *</label>
            <div class="radio-group">
                <label><input type="radio" name="menopausaPrecoce" value="NAO" required> Não</label>
                <label><input type="radio" name="menopausaPrecoce" value="SIM"> Sim</label>
                <label><input type="radio" name="menopausaPrecoce" value="NAO_SEI"> Não Sei</label>
            </div>
        </section>

        <section class="question">
            <label>Há antecedentes na família com ataxia e tremores? *</label>
            <div class="radio-group">
                <label><input type="radio" name="ataxiaTremores" value="NAO" required> Não</label>
                <label><input type="radio" name="ataxiaTremores" value="SIM"> Sim</label>
                <label><input type="radio" name="ataxiaTremores" value="NAO_SEI"> Não Sei</label>
            </div>
        </section>

        <section class="question">
            <label>Assinale os sinais ou sintomas observados: *</label>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="sintomas" value="Atraso na fala"> Demorou para falar</label>
                <label><input type="checkbox" name="sintomas" value="Dificuldades de aprendizado"> Dificuldades no aprendizado</label>
                <label><input type="checkbox" name="sintomas" value="Déficit de atenção"> Déficit de atenção</label>
                <label><input type="checkbox" name="sintomas" value="Deficiência intelectual"> Deficiência Intelectual</label>
                <label><input type="checkbox" name="sintomas" value="Hiperatividade"> Hiperatividade</label>
                <label><input type="checkbox" name="sintomas" value="Agressividade"> Agressividade</label>
                <label><input type="checkbox" name="sintomas" value="Evita contato visual"> Evita contato visual</label>
                <label><input type="checkbox" name="sintomas" value="Evita contato físico"> Evita contato físico</label>
                <label><input type="checkbox" name="sintomas" value="Movimentos repetitivos"> Movimentos repetitivos</label>
                <label><input type="checkbox" name="sintomas" value="Hipermobilidade articular"> Articulações flexíveis</label>
                <label><input type="checkbox" name="sintomas" value="Macroorquidismo"> Testículos maiores que o normal</label>
                <label><input type="checkbox" name="sintomas" value="Face alongada/orelhas"> Face alongada / mandíbula / orelhas</label>
                <label><input type="checkbox" name="sintomas" value="NENHUM"> Não apresenta sintomas</label>
            </div>
        </section>

        <div id="msgConfirmacao" class="msg-confirmacao" style="display:none">
            <div class="msg-icone">✅</div>
            <h2>Avaliação enviada com sucesso!</h2>
            <p>Obrigado por preencher o questionário. Suas informações foram registradas.</p>
            <a href="index.html" class="btn-voltar-inicio">Voltar ao início</a>
        </div>

        <div class="form-actions" id="formActions">
            <button type="button" class="btn-limpar" onclick="window.location.href='autoavaliacao-paciente.html'">← Voltar</button>
            <button type="submit" class="btn-salvar">Enviar Avaliação</button>
        </div>

    </form>
</main>

<script src="../static/js/autoavaliacao-avaliacao.js"></script>
</body>
</html>
