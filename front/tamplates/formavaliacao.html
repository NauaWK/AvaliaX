<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação</title>
    <link rel="stylesheet" href="../static/css/formavaliacao.css">
</head>
<body>

<main class="container">
    <form id="formAvaliacao" class="form-card">

        <div class="form-header">
            <h1 id="tituloFormulario">Questionário de Avaliação</h1>
            <p id="subtituloFormulario">Preencha as informações clínicas do paciente.</p>
        </div>

        <section class="question">
            <label>Já fez exame de DNA para detectar a Síndrome do X Frágil? *</label>
            <div class="radio-group">
                <label><input type="radio" name="testeDna" value="NAO" required> Não</label>
                <label><input type="radio" name="testeDna" value="SIM"> Sim</label>
                <label><input type="radio" name="testeDna" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Tem interesse em fazer o exame de DNA para X Frágil?</label>
            <div class="radio-group">
                <label><input type="radio" name="interesseExame" value="NAO"> Não</label>
                <label><input type="radio" name="interesseExame" value="SIM"> Sim</label>
                <label><input type="radio" name="interesseExame" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label for="resultadoExame">Se SIM, qual o resultado?</label>
            <select id="resultadoExame" name="resultadoExame">
                <option value="">Selecione</option>
                <option value="MUTACAO_COMPLETA">Mutação Completa (+200 repetições)</option>
                <option value="PRE_MUTACAO">Pré-mutação (55 a 199 repetições)</option>
                <option value="ZONA_GRAY">Zona Gray/Intermediária (45 a 54 repetições)</option>
                <option value="MOSAICISMO">Mosaicismo</option>
                <option value="NEGATIVO_XF">Negativo para XF (até 39 repetições)</option>
                <option value="NAO_SEI">Não Sei</option>
            </select>
        </section>

        <section class="question">
            <label>Possui diagnóstico de AUTISMO? *</label>
            <div class="radio-group">
                <label><input type="radio" name="diagnosticoAutismo" value="NAO" required> Não</label>
                <label><input type="radio" name="diagnosticoAutismo" value="SIM"> Sim</label>
                <label><input type="radio" name="diagnosticoAutismo" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Tem irmãos? *</label>
            <div class="radio-group">
                <label><input type="radio" name="possuiIrmaos" value="NAO" required> Não</label>
                <label><input type="radio" name="possuiIrmaos" value="SIM"> Sim</label>
                <label><input type="radio" name="possuiIrmaos" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Há alguém na família com deficiência intelectual, atraso de desenvolvimento, dificuldades de aprendizagem ou autismo? *</label>
            <div class="radio-group">
                <label><input type="radio" name="antecedentesDeficiencia" value="NAO" required> Não</label>
                <label><input type="radio" name="antecedentesDeficiencia" value="SIM"> Sim</label>
                <label><input type="radio" name="antecedentesDeficiencia" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Há antecedentes na família com diagnóstico de menopausa precoce? *</label>
            <div class="radio-group">
                <label><input type="radio" name="antecedentesMenopausa" value="NAO" required> Não</label>
                <label><input type="radio" name="antecedentesMenopausa" value="SIM"> Sim</label>
                <label><input type="radio" name="antecedentesMenopausa" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Há antecedentes na família com ataxia e tremores? *</label>
            <div class="radio-group">
                <label><input type="radio" name="antecedentesAtaxia" value="NAO" required> Não</label>
                <label><input type="radio" name="antecedentesAtaxia" value="SIM"> Sim</label>
                <label><input type="radio" name="antecedentesAtaxia" value="NAO_SEI"> Não sei</label>
            </div>
        </section>

        <section class="question">
            <label>Assinale os sinais ou sintomas observados:</label>
            <div id="sintomasContainer" class="checkbox-grid"></div>
        </section>

        <section class="question">
            <label for="detalhes">Detalhes / observações</label>
            <textarea 
                id="detalhes" 
                name="detalhes" 
                maxlength="255" 
                placeholder="Digite observações sobre a avaliação..."
            ></textarea>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn-salvar" id="btnSalvarAvaliacao">
                Salvar Avaliação
            </button>

            <button type="reset" class="btn-limpar">
                Limpar
            </button>

            <a href="avaliacoes.html" class="btn-voltar">
                Voltar
            </a>
        </div>

    </form>
</main>

<script src="../static/js/formavaliacao.js"></script>
</body>
</html>
