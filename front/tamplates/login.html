<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AvaliaX — Acesso ao sistema</title>
  <link rel="stylesheet" href="../static/css/loginStyle.css" />
</head>
<body>

  <div class="container">

    <div class="left">
      <div class="brand">AvaliaX</div>
      <div class="tagline">
        <h2>Triagem clínica<br>para Síndrome do X Frágil</h2>
        <p>Avalie sinais, registre evidências e identifique pacientes com indicação de teste genético.</p>
      </div>
    </div>

    <div class="right">
      <h1>Acesso ao sistema</h1>
      <p class="sub">Faça login para continuar.</p>

      <div id="msg" class="msg"></div>

      <div class="field">
        <label for="login">Login</label>
        <input type="text" id="login" placeholder="Seu login" />
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" />
      </div>

      <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">Entrar</button>
    </div>

  </div>

  <script src="../static/js/login.js"></script>

</body>
</html>
