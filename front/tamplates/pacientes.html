<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pacientes</title>
    <link rel="stylesheet" href="../static/css/pacientesStyle.css">
</head>
<body>

  <aside class="sidebar">
        <div>
            <div class="logo">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <h2>AvaliaX</h2>
                    <p>TRIAGEM CLÍNICA</p>
                </div>
            </div>
            <ul class="menu">
                <a href="index.html"><li>📊 Painel</li></a>
                <a href="pacientes.html"><li class="active">👥 Pacientes</li></a>
                <a href=""><li>📝 Avaliações</li></a>
                <a href=""><li>📄 Relatórios</li></a>
                <a href=""><li>👤 Usuarios</li></a>
            </ul>
        </div>
        <div class="user-box">
            <div class="info-user" id="info-user">
                
            </div>
            <div class="logout" id="logout">↩ Sair</div>
        </div>
    </aside>

  <main class="main">

    <div class="header">

      <div>
        <h1>Pacientes</h1>
        <p>Gerencie sua lista de pacientes</p>
      </div>

      <button class="btn" id="btn">+ Novo paciente</button>

    </div>

    <div class="search">
      <input id="buscarPaciente" type="text" placeholder="Buscar paciente..." />
    </div>

    <div class="card" id="resultado">
      
    </div>

    
    <div class="overlay" id="overlay">
        
        
        <div class="modal">
            <span class="fechar" id="fecharModal">&times;</span>

            <h2>Cadastrar Paciente</h2>
            
            <form id="formPaciente">
              <div class="form-campos">
                <input type="text" id="nome" class="input-texto" placeholder="Nome">
                <input type="number" id="idade" class="input-texto" placeholder="Idade">
                <input type="text" id="cpf" class="input-texto" placeholder="CPF">
                <input type="text" id="guardiao" class="input-texto" placeholder="Guardião">

                <h3>Genero</h3>
                <div class="genero">
                  <label for="masculino" class="radio-card">
                    <input type="radio" name="genero" id="masculino" value="M">
                          Masculino
                  </label>

                  <label for="feminino" class="radio-card">
                    <input type="radio" name="genero" id="feminino" value="F">
                      Feminino
                  </label>
                </div>

                <button type="submit" class="btn-submit">Salvar</button>
              </div>
            </form>
        </div>

    </div>

  </main>
  <script src="../static/js/pacientes.js"></script>
</body>
</html>
