<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pacientes</title>
    <link rel="stylesheet" href="../static/css/pacientesStyle.css">
</head>
<body>

  <aside class="sidebar">
        <div>
            <div class="logo">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <h2>AvaliaX</h2>
                    <p>TRIAGEM CLÍNICA</p>
                </div>
            </div>
            <ul class="menu">
                <a href="index.html"><li>📊 Painel</li></a>
                <a href="pacientes.html"><li class="active">👥 Pacientes</li></a>
                <a href=""><li>📝 Avaliações</li></a>
                <a href=""><li>📄 Relatórios</li></a>
                <a href=""><li>👤 Usuarios</li></a>
            </ul>
        </div>
        <div class="user-box">
            <div class="info-user" id="info-user">
                
            </div>
            <div class="logout" id="logout">↩ Sair</div>
        </div>
    </aside>

  <main class="main">

    <div class="header">

      <div>
        <h1>Pacientes</h1>
        <p>Gerencie seus pacientes</p>
      </div>

      <a href="formpaciente.html"><button class="btn">+ Novo paciente</button></a>

    </div>

      <div class="busca-container">

      <h2>Buscar Paciente</h2>

        <div class="search">
            <input
                id="cpfPaciente"
                type="text"
                placeholder="Digite o CPF do paciente"
            >

            <button id="btnBuscar" class="btn">
                Buscar
            </button>
        </div>

      </div>

  <div id="resultado" class="paciente-card" style="display:none;">

    <h2 id="nomePaciente"></h2>

    <div class="dados-paciente">

      <p>
          <strong>Idade:</strong>
          <span id="idadePaciente"></span>
      </p>

      <p>
          <strong>Gênero:</strong>
          <span id="generoPaciente"></span>
      </p>

      <p>
          <strong>Mãe:</strong>
          <span id="maePaciente"></span>
      </p>

      <p>
          <strong>Pai:</strong>
          <span id="paiPaciente"></span>
      </p>

    </div>

    <div class="acoes-paciente">
        <button id="btnEditar" class="btn-editar">
            Editar Paciente
        </button>

        <button id="btnAvaliacao" class="btn-avaliacao">
            Iniciar Avaliação
        </button>
    </div>

</div>
 <div class="modal-overlay" id="modalEditarPaciente">
        <div class="modal-editar">
            <button class="btn-fechar-modal" id="fecharModalEditar">×</button>

            <h2>Editar Paciente</h2>

            <form id="formEditarPaciente">
                <h3>Dados do Paciente</h3>

                <label>
                    Nome do Paciente *
                    <input type="text" id="editNomePaciente" required>
                </label>

                <label>
                    Data de Nascimento *
                    <input type="date" id="editDataNascimento" required>
                </label>

                

                <label>
                    Sexo Biológico *
                    <select id="editGeneroPaciente" required>
                        <option value="">Selecione</option>
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                    </select>
                </label>

                <h3>Dados dos Pais</h3>

                <label>
                    Nome da Mãe *
                    <input type="text" id="editNomeMae" required>
                </label>

                <label>
                    Nome do Pai
                    <input type="text" id="editNomePai">
                </label>
                
                <div id="campoAtivoContainer">
                    <label>
                        Status do Paciente
                        <select id="editAtivo">
                            <option value="true">Ativo</option>
                            <option value="false">Inativo</option>
                        </select>
                    </label>
                </div>

                <div class="modal-acoes">
                    <button type="button" class="btn-cancelar" id="cancelarEdicaoPaciente">
                        Cancelar
                    </button>

                    <button type="submit" class="btn-salvar">
                        Salvar alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

  </main>
  <script src="../static/js/pacientes.js"></script>
</body>
</html>
