<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuários</title>
  <link rel="stylesheet" href="../static/css/usuariosStyle.css">
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="logo">
        <div class="logo-icon"></div>
        <div class="logo-text">
          <h2>AvaliaX</h2>
          <p>TRIAGEM CLÍNICA</p>
        </div>
      </div>
      <ul class="menu">
        <a href="index.html"><li>📊 Painel</li></a>
        <a href="pacientes.html"><li>👥 Pacientes</li></a>
        <a href="avaliacoes.html"><li>📝 Avaliações</li></a>
        <a href="relatorios.html"><li>📄 Relatórios</li></a>
        <a href="usuarios.html"><li class="active">👤 Usuários</li></a>
      </ul>
    </div>
    <div class="user-box">
      <div class="info-user">
        <strong id="info-user"></strong>
      </div>
      <div class="logout" id="logout">↩ Sair</div>
    </div>
  </aside>

  <main class="main">

    <div class="header">
      <div>
        <h1>Usuários</h1>
        <p>Gerencie os médicos cadastrados no sistema</p>
      </div>
      <button class="btn" id="btn">+ Novo usuário</button>
    </div>

    <div class="search">
      <input type="text" id="busca" placeholder="Buscar usuário..." />
    </div>

    <div class="card" id="listaUsuarios">
      Nenhum usuário cadastrado.
    </div>

    <div class="overlay" id="overlay">
      <div class="modal">
        <span class="fechar" id="fecharModal">&times;</span>
        <h2 id="modalTitulo">Cadastrar Usuário</h2>

        <div id="msgModal" class="msg"></div>

        <form id="formUsuario">
          <div class="form-campos">
            <input type="text" class="input-texto" id="nome" placeholder="Nome completo" required>
            <input type="text" class="input-texto" id="login" placeholder="Login" required>
            <input type="email" class="input-texto" id="email" placeholder="Email" required>
            <input type="password" class="input-texto" id="senha" placeholder="Senha" required>

            <h3>Perfil</h3>
            <div class="perfil">
              <label class="radio-card">
                <input type="radio" name="perfil" value="USER" checked> Médico
              </label>
              <label class="radio-card">
                <input type="radio" name="perfil" value="ADMIN"> Admin
              </label>
            </div>

            <button type="button" class="btn-excluir-modal" id="btnExcluirModal" style="display:none">Excluir usuário</button>
            <button type="submit" class="btn-submit">Salvar</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="../static/js/usuarios.js"></script>
</body>
</html>
